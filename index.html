<!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Câmbio — Moedas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.8rem; text-align: center; margin: 16px 0 8px; }
    h1 span { color: #22d3ee; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(148,163,184,0.1);
    }
    .card.base { border-color: #22d3ee; box-shadow: 0 0 0 1px rgba(34,211,238,0.2); }
    .card-left { display: flex; align-items: center; gap: 12px; }
    .flag { font-size: 2rem; }
    .code { font-weight: 700; font-size: 1.1rem; }
    .name { font-size: 0.8rem; color: #94a3b8; }
    .value { font-size: 1.5rem; font-weight: 700; font-family: monospace; }
    .value.up { color: #22c55e; }
    .value.down { color: #ef4444; }
    .value.base { color: #22d3ee; }
    .change { font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 100px; }
    .change.up { background: rgba(34,197,94,0.15); color: #22c55e; }
    .change.down { background: rgba(239,68,68,0.15); color: #ef4444; }
    .change.neutral { background: rgba(34,211,238,0.15); color: #22d3ee; }
    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer { text-align: center; padding: 24px 0 16px; color: #64748b; font-size: 0.75rem; }
    .footer a { color: #94a3b8; text-decoration: none; }
    .error { text-align: center; color: #ef4444; padding: 16px; font-size: 0.9rem; }
    .loader { border: 3px solid #1e293b; border-top: 3px solid #22d3ee; border-radius: 50%; width: 32px; height: 32px;
  animation: spin 1s linear infinite; margin: 40px auto; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff;
  padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(148,163,184,0.2); box-shadow: 0 4px 24px
  rgba(0,0,0,0.4); font-size: 0.9rem; z-index: 1000; animation: slideIn 0.3s; }
    .toast.success { border-color: #22c55e; }
    .toast.error { border-color: #ef4444; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform:
  translateX(-50%) translateY(0); } }
  </style>
  </head>
  <body>
  <div class="container">
    <h1>C<span>â</span>mbio</h1>
    <p class="subtitle" id="status">Buscando cotações...</p>

    <div id="loader" class="loader"></div>
    <div id="error" class="error" style="display:none"></div>

    <div id="cards"></div>

    <button class="btn" id="refresh-btn" onclick="carregar()">🔄 Atualizar</button>

    <div class="footer">
      Dados por <a href="https://docs.awesomeapi.com.br/" target="_blank">AwesomeAPI</a> · Feito com ❤️
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="app.js"></script>
  </body>
  </html>
